spring:
  application:
    name: financas-ai
  datasource:
    url: jdbc:h2:mem:financas_ai;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:chave-nao-configurada}
      chat:
        options:
          model: gpt-4o-mini
      audio:
        transcription:
          options:
            model: whisper-1
        speech:
          options:
            model: tts-1
            voice: alloy

server:
  port: 8080
